<style>

.app{max-width:440px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% -10%,#063246,#03070a 38%);padding-bottom:80px}

main{padding:12px 15px}.screen{display:none}.screen.on{display:block}h1{font-size:28px;margin:7px 3px 17px}h2{font-size:17px;margin:20px 3px 10px}
.hero,.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px}.hero{padding:20px;min-height:210px}.hero .tag{color:var(--b);font-size:11px;font-weight:bold;letter-spacing:2px}.hero h1{font-size:31px;line-height:1.03;margin:12px 0}.hero h1 i{color:var(--g);font-style:normal}.muted{color:var(--muted);font-size:12px}
.primary{width:100%;padding:14px;border-radius:10px;background:linear-gradient(90deg,var(--g),var(--b));color:#00150a;font-weight:900;margin-top:12px;border:none}.primary:hover{opacity:0.95}.outline{padding:10px 13px;border:1px solid var(--g);border-radius:9px;background:#06140e;color:var(--g);font-weight:bold;cursor:pointer;transition:0.2s}.outline:hover{background:rgba(39,255,115,0.1)}.danger{border-color:var(--r);color:var(--r);background:#180b10;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.card{padding:15px;min-height:94px}.card,.list,.form{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px}.card{cursor:pointer;transition:border-color 0.2s}.card:hover{border-color:var(--g)}.ico{font-size:23px;margin-bottom:9px}.card b{display:block}.card small{color:var(--muted);font-size:11px;line-height:1.35}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:72px;background:#03090ddd;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));z-index:10;padding:0 3px;backdrop-filter:blur(5px)}.nav button{background:none;color:#718b95;font-size:10px;min-width:0;padding:5px 1px;white-space:nowrap;overflow:hidden;border:none;transition:color 0.2s}.nav button b{display:block;font-size:19px;line-height:20px;margin-bottom:3px}.nav button.on{color:var(--g)}
.list{padding:12px;margin-top:12px}.item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #15323c}.item:last-child{border-bottom:0}.thumb{width:48px;height:43px;border-radius:9px;background:#071018;display:grid;place-items:center;font-size:21px}.grow{flex:1}.item b{font-size:14px}.item small{display:block;color:var(--muted);margin-top:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.form{padding:14px;margin-bottom:12px}.field{width:100%;padding:12px;margin:6px 0 10px;background:#030b10;border:1px solid var(--line);border-radius:9px;color:#fff;outline:none;transition:border-color 0.2s}.field:focus{border-color:var(--b)}.field:disabled{opacity:0.6;cursor:not-allowed}textarea.field{min-height:110px;resize:vertical}
.set{display:grid;grid-template-columns:30px 1fr 1fr 64px;gap:6px;align-items:center;margin-top:7px}.set input{min-width:0}.set button{padding:9px}.exerciseBlock{padding:13px;border:1px solid var(--line);border-radius:11px;margin:9px 0;background:#061119}.pill{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#07141d;color:var(--g);font-size:11px;cursor:pointer}.done{border-color:var(--g)!important;color:var(--g)!important}.tabs{display:flex;gap:4px;background:#061019;border:1px solid var(--line);padding:3px;border-radius:9px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border:0;border-radius:7px;background:none;color:var(--muted);cursor:pointer;transition:0.2s}.tabs button.on{background:var(--g);color:#00120a;font-weight:bold}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}.modalBox{width:100%;max-width:440px;background:#081720;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px;max-height:80vh;overflow:auto}.choice{width:100%;padding:13px;margin:5px 0;text-align:left;background:#07141d;border:1px solid var(--line);border-radius:9px;color:white;cursor:pointer;transition:border-color 0.2s;border:none}.choice:hover{border:1px solid var(--g)}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-20px);background:#0a1b23;border:1px solid var(--g);padding:12px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-weight:bold}.toast.show{opacity:1;transform:translate(-50%,0)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat .panel{padding:13px;text-align:center}.stat strong{display:block;font-size:18px}.stat small{color:var(--muted);font-size:10px}
.bar{height:150px;display:flex;align-items:end;gap:6px;border-bottom:1px solid var(--line);padding:8px}.bar div{flex:1;background:linear-gradient(#27ff73,#087ca0);border-radius:5px 5px 0 0}
.calendar{padding:10px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal span{padding:9px 0;text-align:center;background:#07141d;border-radius:7px;font-size:11px}.cal .train{border:1px solid var(--g);color:var(--g);background:#082016}.cal .today{border-color:var(--b)!important;box-shadow:0 0 0 1px var(--b) inset}.cal .event{border-color:var(--b)}.cal .empty{background:transparent}.calMonth{padding:10px 0 6px}.calMonthTitle{font-size:15px;font-weight:900;margin-bottom:8px}.calWeek{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}.calWeek span{padding:5px 0;text-align:center;color:var(--muted);font-size:10px}.yearGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.yearCard{padding:10px;background:#07141d;border:1px solid var(--line);border-radius:10px;min-width:0}.yearCard .calMonth{padding:5px}.yearCard .calMonthTitle{font-size:11px}.yearCard .cal span{padding:5px 0;font-size:9px}.yearCard b{display:block;margin-bottom:7px}.calLegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.calLegend span{font-size:10px;color:var(--muted)}.legendDot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--g)}.legendDot.eventDot{background:var(--b)}

<body>
<div class="app">
  <header>
    <div class="logo"><i>💪</i>GYM PRO</div>
    <button id="themeToggle" title="Farbmodus">🌙</button>
  </header>
  
  <main>
    <!-- Standard Screens werden hier eingefügt -->
    <div id="home" class="screen on">
      <div class="hero">
        <div class="tag">FITNESS TRACKER</div>
        <h1>Willkommen zu <i>GYM PRO</i></h1>
        <p class="muted">Dein persönlicher Trainings- und Ernährungsassistent</p>
        <button class="primary" onclick="safe(()=>go('workouts'))">▶ Zum Training</button>
      </div>
    </div>

    <!-- Weitere Screens folgen... -->
  </main>

  <nav class="nav">
    <button id="navHome" class="on" onclick="safe(()=>go('home'))"><b>🏠</b>Home</button>
    <button id="navWorkouts" onclick="safe(()=>go('workouts'))"><b>💪</b>Workouts</button>
    <button id="navPlan" onclick="safe(()=>go('plan'))"><b>📅</b>Plan</button>
    <button id="navNutrition" onclick="safe(()=>go('nutrition'))"><b>🍎</b>Ernährung</button>
    <button id="navStats" onclick="safe(()=>go('stats'))"><b>📊</b>Statistik</button>
    <button id="navSettings" onclick="safe(()=>go('settings'))"><b>⚙️</b>Einstellungen</button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script id="gym-pro-core-js">
(function(){
  // === CORE INITIALIZATION - BUG FIXES v8 ===
  
  // Global error handler - verhindert, dass fehler die App beschädigen
  window.addEventListener('error', (e) => {
    console.error('App Error:', e.error);
    try { toast('Fehler: ' + (e.error?.message || 'Unbekannter Fehler')); } catch(_) {}
  });

  // Safe execution wrapper - verhindert DOM-Fehler
  window.safe = function(fn) {
    try {
      if (typeof fn === 'function') return fn();
    } catch(e) {
      console.error('Safe execution error:', e);
      toast('Fehler aufgetreten: ' + (e?.message || 'Unbekannt'));
    }
  };

  // DOM-Zugriff - sicher und effizient
  const $e = (id) => document.getElementById(id) || null;
  const $ = $e; // kurzer Alias
  const by = (selector) => document.querySelector(selector);

  // Globale Daten
  const KEY = 'GYM_PRO_DATA_v8';
  let data = {
    workouts: [],
    exercises: [],
    meals: [],
    profile: { name: '', photo: '', sound: 'beep', volume: 0.7, theme: 'dark' },
    plan: { name: 'Mein Trainingsplan', pause: 90, items: [] },
    goals: [],
    water: {},
    waterGoal: 2500,
    noteFolders: [{ id: generateId(), name: 'Allgemein' }],
    notes: []
  };

  // Eindeutige IDs generieren
  function generateId() {
    return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  }
  window.uid = generateId;

  // Daten speichern/laden - mit Error Handling
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch(e) {
      console.error('Speicherfehler:', e);
      toast('Daten konnten nicht gespeichert werden');
    }
  }
  window.save = save;

  function load() {
    try {
      const stored = localStorage.getItem(KEY);
      if (stored) {
        const loaded = JSON.parse(stored);
        // Merge mit Default Data für neue Felder
        data = Object.assign({}, data, loaded || {});
        // Stelle sicher, dass Arrays existieren
        data.workouts = Array.isArray(data.workouts) ? data.workouts : [];
        data.exercises = Array.isArray(data.exercises) ? data.exercises : [];
        data.meals = Array.isArray(data.meals) ? data.meals : [];
        data.goals = Array.isArray(data.goals) ? data.goals : [];
        data.profile = data.profile || {};
      }
    } catch(e) {
      console.error('Ladefehler:', e);
      toast('Daten konnten nicht geladen werden - Neuer Start');
    }
  }

  // HTML Escaping - verhindert XSS
  function esc(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }
  window.esc = esc;

  // Toast Nachrichten mit Auto-Hide
  let toastTimeout;
  function toast(msg) {
    clearTimeout(toastTimeout);
    const el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    toastTimeout = setTimeout(() => {
      el.classList.remove('show');
    }, 3000);
  }
  window.toast = toast;

  // Navigation mit Screen-Wechsel
  let currentScreen = 'home';
  function go(screen) {
    const old = $('screen.on');
    if (old) old.classList.remove('on');
    
    const newScreen = $(screen);
    if (!newScreen) {
      console.warn('Screen nicht gefunden:', screen);
      return;
    }
    
    newScreen.classList.add('on');
    currentScreen = screen;

    // Update Navigation Buttons
    document.querySelectorAll('.nav button').forEach((btn, i) => {
      btn.classList.remove('on');
    });
    const screenToNavMap = {
      'home': 'navHome',
      'workouts': 'navWorkouts',
      'plan': 'navPlan',
      'nutrition': 'navNutrition',
      'stats': 'navStats',
      'settings': 'navSettings'
    };
    const navBtn = $(screenToNavMap[screen]);
    if (navBtn) navBtn.classList.add('on');

    // Scroll to top
    window.scrollTo(0, 0);
  }
  window.go = go;

  // Theme Toggle
  function initTheme() {
    const saved = localStorage.getItem('GYM_PRO_THEME');
    const theme = saved || 'dark';
    if (theme === 'light') {
      document.body.classList.add('clean');
    }
    
    const btn = $('themeToggle');
    if (btn) {
      btn.onclick = () => {
        document.body.classList.toggle('clean');
        const isLight = document.body.classList.contains('clean');
        localStorage.setItem('GYM_PRO_THEME', isLight ? 'light' : 'dark');
        btn.textContent = isLight ? '☀️' : '🌙';
      };
      btn.textContent = theme === 'light' ? '☀️' : '🌙';
    }
  }

  // Event Delegation für dynamische Elemente
  document.addEventListener('click', (e) => {
    if (e.target.matches('.screen button[onclick*="go("]')) {
      // Buttons mit go() sind bereits handlers
    }
  });

  // Initiale Ausgabe - nur wenn DOM ready
  function init() {
    load();
    initTheme();
    console.log('✓ GYM PRO v8 initialized');
    toast('✓ Willkommen zu GYM PRO v8');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Globale Exports
  window.data = data;
  window.go = go;
  window.$ = $;
  window.by = by;
  window.esc = esc;
  window.toast = toast;
  window.safe = safe;

})();
</script>

<script id="gym-pro-v2-enhancements">
(function(){
  // === V2 ENHANCEMENTS - Stats & Graphs ===
  
  const $ = (id) => document.getElementById(id);
  const safe = window.safe || function(fn) { try { fn(); } catch(e) { console.error(e); } };

  window.initV2 = function() {
    try {
      if (typeof renderV2Stats === 'function') {
        renderV2Stats();
      }
      if (typeof updateV2Calories === 'function') {
        updateV2Calories();
      }
    } catch(e) {
      console.error('V2 Init Error:', e);
    }
  };

  window.updateV2Calories = function() {
    try {
      const burned = (window.data?.workouts || [])
        .filter(w => w.completed)
        .reduce((s, w) => s + Number(w.caloriesBurned || 0), 0);
      
      const eaten = (window.data?.meals || [])
        .reduce((s, m) => s + Number(m.kcal || m.calories || 0), 0);
      
      const b = $('v2BurnedCalories');
      const e = $('v2EatenCalories');
      const n = $('v2NetCalories');
      
      if (b) b.textContent = Math.round(burned);
      if (e) e.textContent = Math.round(eaten);
      if (n) n.textContent = Math.round(eaten - burned);
    } catch(e) {
      console.error('Calorie update error:', e);
    }
  };

  // Chart-Zeichnung mit Fehlerbehandlung
  window.drawChart = function(rows = []) {
    const c = $('v2Chart');
    if (!c || !c.getContext) return;
    
    try {
      const ctx = c.getContext('2d');
      const W = c.clientWidth * 2 || 800;
      const H = 220 * 2;
      
      c.width = W;
      c.height = H;
      
      ctx.scale(2, 2);
      const w = W / 2, h = H / 2;
      
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#27ff73';
      ctx.fillStyle = '#27ff73';
      ctx.font = '12px Arial';
      ctx.fillStyle = '#7d98a4';
      
      if (!rows.length) {
        ctx.fillText('Noch keine Daten', 20, 30);
        return;
      }
      
      const vals = rows.map(x => x.value);
      const max = Math.max(...vals);
      const min = Math.min(...vals);
      const range = Math.max(1, max - min);
      
      ctx.strokeStyle = '#27ff73';
      ctx.lineWidth = 2;
      ctx.beginPath();
      
      rows.forEach((r, i) => {
        const x = 20 + (w - 40) * (i / Math.max(1, rows.length - 1));
        const y = h - 25 - (h - 55) * (r.value - min) / range;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      
      ctx.stroke();
      
      ctx.fillStyle = '#27ff73';
      rows.forEach((r, i) => {
        const x = 20 + (w - 40) * (i / Math.max(1, rows.length - 1));
        const y = h - 25 - (h - 55) * (r.value - min) / range;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    } catch(e) {
      console.error('Chart draw error:', e);
    }
  };

  setTimeout(() => {
    safe(() => {
      if (typeof window.initV2 === 'function') {
        window.initV2();
      }
    });
  }, 300);
})();
</script>

<script id="gym-pro-active-enhancement">
(function(){
  // === ACTIVE TRAINING ENHANCEMENTS ===
  
  const $ = (id) => document.getElementById(id);
  const safe = window.safe || function(fn) { try { fn(); } catch(e) { console.error(e); } };

  function activeStats() {
    const body = $('activeBody');
    if (!body) return null;
    
    const cards = [...body.querySelectorAll('.gp-exercise-card')];
    const total = cards.length;
    let done = 0;
    let firstOpen = null;
    
    cards.forEach((card, idx) => {
      const hasDone = card.querySelector('.pill.done');
      if (hasDone) done++;
      if (!hasDone && firstOpen === null) firstOpen = idx;
    });
    
    return { cards, total, done, firstOpen };
  }

  function updateActiveHeader() {
    const body = $('activeBody');
    if (!body) return;
    
    let wrap = $('gpLiveHeader');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'gpLiveHeader';
      wrap.className = 'gp-live-head';
      
      const title = $('activeTitle');
      if (title) title.parentNode.insertBefore(wrap, title);
      else body.parentNode.insertBefore(wrap, body);
      
      wrap.innerHTML = `
        <div class="gp-live-top">
          <div>
            <strong id="gpLiveStatus">Workout</strong>
            <div class="gp-live-progress"><i id="gpLiveProgress" style="width:0%"></i></div>
          </div>
          <div class="gp-live-counter" id="gpLiveCounter">0/0</div>
        </div>
        <div class="gp-live-actions">
          <button type="button" class="outline" id="gpNextSetBtn">▶ Nächster Satz</button>
          <button type="button" class="outline" id="gpResetRestBtn">⏭ Pause überspringen</button>
        </div>
      `;
      
      const oldInfo = $('activeInfo');
      if (oldInfo) oldInfo.style.display = 'none';
      
      $('gpNextSetBtn').onclick = () => safe(() => nextSet());
      $('gpResetRestBtn').onclick = () => safe(() => $('skipRest')?.click());
    }
    
    const s = activeStats();
    if (!s) return;
    
    const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    const c = $('gpLiveCounter');
    if (c) c.textContent = s.done + '/' + s.total;
    
    const bar = $('gpLiveProgress');
    if (bar) bar.style.width = pct + '%';
    
    const st = $('gpLiveStatus');
    if (st) st.textContent = pct >= 100 ? '✓ Alle Sätze erledigt' : (s.done ? 'Weiter geht\'s' : 'Bereit?');
    
    [...document.querySelectorAll('#active .gp-exercise-card')].forEach((x, i) => {
      x.classList.toggle('gp-current', i === s.firstOpen);
    });
  }

  function nextSet() {
    const body = $('activeBody');
    if (!body) return;
    
    const s = activeStats();
    if (!s) return;
    
    if (s.firstOpen == null) {
      $('finishWorkout')?.click();
      return;
    }
    
    const card = s.cards[s.firstOpen];
    const btn = [...card.querySelectorAll('.set button')].find(b => !b.classList.contains('done'));
    if (btn) {
      btn.click();
      setTimeout(() => updateActiveHeader(), 20);
    }
    
    const input = card.querySelector('.set:not(:has(.pill.done)) input');
    if (input) {
      input.focus();
      input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function enhanceActive() {
    if (!$('active')) return;
    
    const body = $('activeBody');
    if (!body || body.__gpEnhanced) return;
    body.__gpEnhanced = true;
    
    updateActiveHeader();
    
    if (!$('gpActiveBottom')) {
      const bar = document.createElement('div');
      bar.id = 'gpActiveBottom';
      bar.className = 'gp-bottom-bar';
      bar.innerHTML = `
        <div class="gp-bottom-grid">
          <button type="button" class="outline" id="gpBottomNext">▶ Nächster Satz</button>
          <button type="button" class="primary" id="gpBottomFinish">✓ Training beenden</button>
        </div>
      `;
      $('active').appendChild(bar);
      $('gpBottomNext').onclick = () => safe(() => nextSet());
      $('gpBottomFinish').onclick = () => safe(() => $('finishWorkout')?.click());
    }
  }

  window.enhanceActive = enhanceActive;
  window.activeStats = activeStats;
  window.updateActiveHeader = updateActiveHeader;
  window.nextSet = nextSet;

  // Hook into existing render function
  const oldRenderActive = window.renderActive;
  if (typeof oldRenderActive === 'function') {
    window.renderActive = function() {
      const r = oldRenderActive.apply(this, arguments);
      setTimeout(() => {
        safe(() => enhanceActive());
      }, 0);
      return r;
    };
  }

  // Monitor screen changes
  setInterval(() => {
    if ($('active')?.classList.contains('on')) {
      safe(() => updateActiveHeader());
    }
  }, 700);
})();
</script>

<script id="gym-pro-safety-wrappers">
(function(){
  // === SAFETY WRAPPERS - Verhindert Fehler bei fehlenden Funktionen ===
  
  const safe = window.safe || function(fn) { try { fn(); } catch(e) { console.error(e); } };

  // Sichere alle Event-Listener
  if (typeof window.markSet === 'function') {
    const oldMarkSet = window.markSet;
    window.markSet = function() {
      try {
        return oldMarkSet.apply(this, arguments);
      } catch(e) {
        console.error('markSet error:', e);
      }
    };
  }

  // Sichere Finish-Funktionen
  const finishCandidates = ['finishWorkout', 'completeWorkout', 'endWorkout'];
  finishCandidates.forEach(name => {
    if (typeof window[name] === 'function') {
      const old = window[name];
      window[name] = function(...args) {
        try {
          return old.apply(this, args);
        } catch(e) {
          console.error(name + ' error:', e);
          if (window.toast) window.toast('Fehler beim Training beenden');
        }
      };
    }
  });

  console.log('✓ Safety wrappers installed');
})();
</script>
